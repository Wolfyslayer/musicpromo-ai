# OAuth providers redirect the browser here with no Supabase user JWT.
[functions.meta-oauth-callback]
verify_jwt = false

[functions.tiktok-oauth-callback]
verify_jwt = false

[functions.youtube-oauth-callback]
verify_jwt = false

[functions.metaCustomCallback]
verify_jwt = false

[functions.socialOAuthCallback]
verify_jwt = false

# Scheduled worker is called with the service role, not a user session.
[functions.campaignWorker]
verify_jwt = false

# Google login PKCE register (pre-session; called before the user has a JWT).
[functions.registerGoogleOAuthPkce]
verify_jwt = false

# Google login code exchange (pre-session; redirect URI is the app domain).
[functions.googleAuthExchange]
verify_jwt = false

# Public read proxy for music-promo-assets (CORS for on-device video render).
[functions.promoMediaProxy]
verify_jwt = false

[functions.getPublicProfile]
verify_jwt = false

[functions.sendLaunchDigest]
verify_jwt = false

[functions.sendDailyStatsDigest]
verify_jwt = false

# TemPolor song-generation callbacks (no user JWT).
[functions.tempolorSongCallback]
verify_jwt = false

# Guest ticket form on /privacy and /terms (no user session required).
[functions.submitSupportTicket]
verify_jwt = false

[functions.stripeBillingWebhook]
verify_jwt = false
