# Offset schedule (~every 2–3 min with campaign-worker-cron.yml).
# GitHub scheduled workflows are limited to 5-minute granularity.

name: Campaign worker cron (offset)

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

concurrency:
  group: campaign-worker-cron-offset
  cancel-in-progress: false

jobs:
  run-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invoke campaignWorker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Skipping: set SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY repository secrets."
            exit 0
          fi
          curl -sfS -X POST "${SUPABASE_URL%/}/functions/v1/campaignWorker" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"skipStats":true,"batchLimit":30}' \
            --max-time 120
