# Hourly cron for daily stats email + push (sendDailyStatsDigest).
# Each user with email/push enabled receives once per local day after daily_stats_notify_time.
#
# GitHub secrets: SUPABASE_PROJECT_REF, LAUNCH_DIGEST_CRON_SECRET
# Supabase secrets: RESEND_API_KEY, LAUNCH_DIGEST_FROM_EMAIL (email), FCM_SERVICE_ACCOUNT_JSON (push)

name: Daily stats digest (hourly)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: daily-stats-digest-hourly
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Invoke sendDailyStatsDigest
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          LAUNCH_DIGEST_CRON_SECRET: ${{ secrets.LAUNCH_DIGEST_CRON_SECRET }}
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$LAUNCH_DIGEST_CRON_SECRET" ]; then
            echo "Skipping — set SUPABASE_PROJECT_REF and LAUNCH_DIGEST_CRON_SECRET in GitHub Actions secrets."
            exit 0
          fi
          curl -sfS -X POST \
            -H "x-daily-stats-secret: ${LAUNCH_DIGEST_CRON_SECRET}" \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/sendDailyStatsDigest" \
            --max-time 120
