# One-time upload keystore for Play (no Termux / no local keytool).
# 1. Create GitHub secrets: ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#    (pick passwords in GitHub Settings — any phone browser.)
# 2. Run this workflow once → download artifacts → add ANDROID_UPLOAD_KEYSTORE_BASE64 from the .txt file.
# 3. Back up upload.keystore to cloud storage; never commit it.

name: Generate Android upload keystore

on:
  workflow_dispatch:

jobs:
  generate:
    name: Create upload keystore
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Validate signing secrets
        env:
          STORE: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in STORE ALIAS KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Add ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD repository secrets first (choose your own passwords in GitHub Settings)."
              exit 1
            fi
          done

      - name: Generate keystore
        env:
          STORE: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keytool -genkeypair -v -storetype PKCS12 -keystore upload.keystore -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE" -keypass "$KEY" \
            -dname "CN=MusicPromo AI, OU=Mobile, O=MusicPromo, L=NA, ST=NA, C=US"
          base64 -w 0 upload.keystore > upload.keystore.base64.txt

      - uses: actions/upload-artifact@v4
        with:
          name: android-upload-keystore
          path: upload.keystore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: android-upload-keystore-base64
          path: upload.keystore.base64.txt
          retention-days: 7

      - name: Summary
        run: |
          {
            echo "### Upload keystore created"
            echo ""
            echo "1. Download **android-upload-keystore** → save \`upload.keystore\` to Google Drive (backup)."
            echo "2. Download **android-upload-keystore-base64** → open the \`.txt\` file → copy all text."
            echo "3. GitHub → Settings → Secrets → **ANDROID_UPLOAD_KEYSTORE_BASE64** → paste (one line)."
            echo "4. Run **Build Android release AAB** when ready for Play."
            echo ""
            echo "Artifacts expire in 7 days — back up the keystore file before then."
          } >> "$GITHUB_STEP_SUMMARY"
