# Nudge campaignWorker every 5 minutes so scheduled SocialPosts publish on time.
# Requires repository secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY

name: Campaign worker cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: campaign-worker-cron
  cancel-in-progress: false

jobs:
  run-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invoke campaignWorker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Skipping: set SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY repository secrets."
            exit 0
          fi
          curl -sfS -X POST "${SUPABASE_URL%/}/functions/v1/campaignWorker" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"skipStats":true,"batchLimit":15}' \
            --max-time 120
