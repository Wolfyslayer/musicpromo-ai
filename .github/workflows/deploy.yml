# Deploy Supabase Edge Functions + Vite frontend on push to main.
# Edge Functions deploy only when supabase/functions (or config.toml) change.
# Setup: docs/GITHUB_DEPLOY.md

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.filter.outputs.functions }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            functions:
              - 'supabase/functions/**'
              - 'supabase/config.toml'
              - 'supabase/migrations/**'
            frontend:
              - 'src/**'
              - 'public/**'
              - 'index.html'
              - 'vite.config.js'
              - 'tailwind.config.js'
              - 'postcss.config.js'
              - 'jsconfig.json'
              - 'components.json'
              - 'package.json'
              - 'package-lock.json'
              - 'capacitor.config.ts'
              # Deploy workflow changes base path / Pages steps — must rebuild the site.
              - '.github/workflows/deploy.yml'

  deploy-supabase:
    name: Supabase (Edge Functions)
    needs: changes
    if: needs.changes.outputs.functions == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - name: Deploy all Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF repository secrets (see docs/GITHUB_DEPLOY.md)."
            exit 1
          fi
          # Supabase occasionally returns transient 500s (e.g. "FGA Authentication Error") mid-deploy.
          max_attempts=4
          for attempt in $(seq 1 "$max_attempts"); do
            echo "Edge function deploy attempt ${attempt}/${max_attempts}…"
            if supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"; then
              exit 0
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep_seconds=$((attempt * 30))
              echo "Deploy failed; waiting ${sleep_seconds}s before retry…"
              sleep "$sleep_seconds"
            fi
          done
          echo "::error::Edge function deploy failed after ${max_attempts} attempts."
          exit 1

  deploy-frontend:
    name: Frontend (GitHub Pages)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Configure Vite base path
        run: |
          # musicpromoai.site (and most GitHub Pages custom domains) are served at "/".
          # Only set VITE_BASE_PATH=/<repo>/ if you use https://user.github.io/<repo>/ without a custom domain.
          if [ -n "${{ vars.VITE_BASE_PATH }}" ]; then
            BASE="${{ vars.VITE_BASE_PATH }}"
          else
            BASE="/"
          fi
          case "$BASE" in
            *.*)
              echo "::error::VITE_BASE_PATH must be a URL path (e.g. /), not a domain. Remove or fix the VITE_BASE_PATH repository variable."
              exit 1
              ;;
          esac
          echo "VITE_BASE_PATH=$BASE" >> "$GITHUB_ENV"

      - name: Install and build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          # Omit or set to "off" to hide pay-per-use cloud clip UI (default in app logic).
          VITE_AI_VIDEO_PROVIDER: ${{ vars.VITE_AI_VIDEO_PROVIDER }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Add VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi
          npm ci
          npm run build
          if ! compgen -G "dist/assets/renderPromoRemotion-*.js" > /dev/null; then
            echo "::error::Build did not emit renderPromoRemotion chunk — promo video encode will fail in production."
            exit 1
          fi

      - name: SPA fallback for client-side routes
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          if [ -n "${{ vars.CUSTOM_DOMAIN }}" ]; then
            echo "${{ vars.CUSTOM_DOMAIN }}" > dist/CNAME
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
