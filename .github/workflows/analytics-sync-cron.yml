# Pull IG / TikTok / YouTube metrics into analytics_entries (via campaignWorker stats pass).
# Requires repository secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
# Edge secret: SOCIAL_TOKEN_ENCRYPTION_KEY

name: Analytics stats sync (hourly)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: analytics-stats-sync-hourly
  cancel-in-progress: false

jobs:
  sync-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Invoke campaignWorker (stats only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Skipping: set SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY repository secrets."
            exit 0
          fi
          curl -sfS -X POST "${SUPABASE_URL%/}/functions/v1/campaignWorker" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"skipPublish":true,"skipVideo":true,"batchLimit":5}' \
            --max-time 300
